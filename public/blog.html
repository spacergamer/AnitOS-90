<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anitope Blog</title>
<link rel="icon" href="/anitopeboard/img/as.ico">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--win:#c0c0c0;--light:#fff;--dark:#808080;--black:#000;--blue:#000080;--cyan:#05ffa1;--teal:#008080}
*{box-sizing:border-box}
html{min-height:100%;background:var(--teal)}
body{margin:0;min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,var(--teal),#000033);font-family:'VT323',monospace;font-size:22px;color:#111;padding:0}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%);background-size:100% 4px}
body::before{z-index:10005;animation:scroll-lines 8s linear infinite}
body::after{z-index:10004}
@keyframes scroll-lines{0%{background-position:0 0}100%{background-position:0 100%}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
button,input,textarea{font:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
main{width:min(1600px,100%);margin:0 auto;padding:0 18px 18px;position:relative;z-index:1}
.site-window{position:sticky;top:0;z-index:2;width:100%;background:var(--win);border-top:3px solid var(--light);border-left:3px solid var(--light);border-right:3px solid var(--black);border-bottom:3px solid var(--black);box-shadow:inset -1px -1px var(--dark),inset 1px 1px var(--light);padding:4px;margin:0 0 14px}
.site-header{display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(90deg,var(--blue),#1084d0);color:#fff}
.brand-logo{display:block;width:38px;height:38px;object-fit:contain;background:#fff;border:1px solid #777;padding:1px;flex:0 0 38px}
.brand-copy{min-width:0;display:flex;flex-direction:column}
.brand-title{font-size:29px;line-height:1;color:#fff;text-shadow:1px 1px #000}
.brand-subtitle{font-size:18px;line-height:1;color:#ddd}
.site-nav{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap;padding:7px 5px 0;background:var(--win);border-top:2px groove #fff;border-left:0;border-right:0;border-bottom:0}
.site-tab{flex:0 1 auto;min-width:78px;text-align:center;padding:5px 13px 4px;background:#c0c0c0;color:#111;border:2px outset #fff;border-bottom:0;font-size:21px;line-height:1;cursor:pointer;text-decoration:none}
.site-tab:hover{background:#dedede;text-decoration:none}
.site-tab:active{border-style:inset}
.site-tab.active{position:relative;top:1px;background:#e5e5e5;border-style:outset;border-bottom:2px solid #e5e5e5;font-weight:bold}
.site-tab.exit{color:#8b0000}
.nav-message{display:none;margin:8px 0 0;padding:7px 9px;background:#111;color:var(--cyan);border:2px inset var(--dark);font-size:19px}
.nav-message.visible{display:block}
.page-heading{font-size:34px;color:#fff;text-shadow:2px 2px #000;margin:12px 0}
.profile-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.profile-sidebar,.profile-main{min-width:0}
.orkut-box{background:var(--win);border:3px solid;border-color:var(--light) var(--black) var(--black) var(--light);box-shadow:inset -1px -1px var(--dark),inset 1px 1px var(--light);padding:4px;margin-bottom:12px;overflow:hidden}
.orkut-box-title{background:linear-gradient(90deg,var(--blue),#1084d0);color:#fff;font-weight:bold;padding:4px 8px;font-size:22px;text-shadow:1px 1px #000;border-bottom:0}
.orkut-box-content{padding:9px;background:#e5e5e5;border:2px inset #777;margin-top:4px}
.profile-cover{height:112px;background:linear-gradient(120deg,#008080,#000080);background-size:cover;background-position:center;border:2px inset var(--dark)}
.profile-identity{padding:0 7px 8px;display:flex;align-items:flex-end;gap:10px;margin-top:-32px;position:relative}
.profile-avatar{width:88px;height:88px;flex:0 0 88px;object-fit:cover;background:#e6eaf0;border:3px solid white;box-shadow:1px 1px 2px #000;border-radius:0}
.profile-identity-text{min-width:0;padding-bottom:5px}
.profile-display-name{font-size:27px;line-height:1.05;font-weight:bold;color:#000;overflow-wrap:anywhere}
.profile-handle{font-size:19px;color:#444;margin-top:4px}
.profile-edit-link{display:inline-block;margin-top:3px;padding:0;border:0;background:transparent;color:var(--blue);font:17px 'VT323',monospace;text-decoration:underline;cursor:pointer}
.profile-edit-link:hover{color:#0000cc;background:transparent}
.profile-bio{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;color:#111}
.profile-scrap-table{width:100%;border-collapse:collapse;font:20px 'VT323',monospace}
.profile-scrap-table td{border-bottom:1px solid #aaa;padding:7px 8px;vertical-align:top;line-height:1.2}
.profile-scrap-table tr:last-child td{border-bottom:0}
.profile-scrap-table td:first-child{width:32%;font-weight:bold;color:var(--blue);background:#e5e5e5}
.profile-field-editor{display:grid;gap:8px}
.profile-field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:7px;align-items:center}
.profile-field-row input{min-width:0}
label{display:block;font-weight:bold;color:#111;margin:10px 0 4px}
input,textarea{width:100%;padding:6px;border:2px inset var(--dark);border-radius:0;background:#fff;color:#111;font:20px 'VT323',monospace}
input:focus,textarea:focus{outline:1px solid var(--blue)}
textarea{min-height:90px;resize:vertical}
button{padding:6px 11px;background:var(--win);border-top:2px solid var(--light);border-left:2px solid var(--light);border-right:2px solid var(--black);border-bottom:2px solid var(--black);border-radius:0;color:#111;cursor:pointer;font:20px 'VT323',monospace}
button:hover{background:#dedede}
button:active{border:2px inset var(--dark)}
button:disabled{opacity:.6;cursor:wait}
.primary-button{background:var(--blue);border-color:var(--light) var(--black) var(--black) var(--light);color:#fff;font-weight:bold}
.primary-button:hover{background:#10109b}
.card{background:#fff;border:2px inset var(--dark);padding:12px;margin-top:12px}
.card h2{font-size:25px;color:var(--blue);margin:0 0 5px}
.muted,small{font-size:19px;color:#444}
.profile-editor-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10001}
.profile-editor-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;z-index:10002;margin:0;box-shadow:4px 4px 0 #000}
[hidden]{display:none!important}
.profile-editor{display:grid;grid-template-columns:1fr;gap:10px}
.profile-editor .wide{grid-column:auto}
.profile-editor textarea{min-height:90px}
.profile-role-field label{margin:10px 0 4px;font-size:24px;color:#111}
.profile-role-field select{display:block;width:100%;min-height:42px;padding:7px 9px;border:2px inset var(--dark);border-radius:0;background:#fff;color:#111;font:23px 'VT323',monospace}
.profile-preview-banner{height:150px;position:relative;overflow:hidden;background:linear-gradient(120deg,#008080,#000080);border:2px inset var(--dark);cursor:grab;touch-action:none}
.profile-preview-banner:active{cursor:grabbing}
.profile-preview-banner img{position:absolute;max-width:none;max-height:none;user-select:none;pointer-events:none}
.profile-preview-banner::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(33.333% - 1px),rgba(255,255,255,.8) calc(33.333% - 1px),rgba(0,0,0,.55) 33.333%,transparent calc(33.333% + 1px),transparent calc(66.666% - 1px),rgba(255,255,255,.8) calc(66.666% - 1px),rgba(0,0,0,.55) 66.666%,transparent calc(66.666% + 1px)),linear-gradient(to bottom,transparent calc(33.333% - 1px),rgba(255,255,255,.8) calc(33.333% - 1px),rgba(0,0,0,.55) 33.333%,transparent calc(33.333% + 1px),transparent calc(66.666% - 1px),rgba(255,255,255,.8) calc(66.666% - 1px),rgba(0,0,0,.55) 66.666%,transparent calc(66.666% + 1px))}
.profile-photo-pick{display:block;width:180px;height:180px;max-width:100%;margin:8px auto;border:0;padding:0;background:transparent;cursor:pointer}
.profile-photo-pick:hover{background:transparent;filter:brightness(.88)}
.profile-photo-pick img{display:block;width:100%;height:100%;object-fit:cover;border:3px solid #fff;box-shadow:1px 1px 2px #000;background:#eee;aspect-ratio:1/1}
.profile-banner-controls{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;align-items:center;margin-top:8px}
.profile-banner-controls label{margin:0}
.profile-banner-controls input{grid-column:2;max-width:100%}
.profile-image-hint{display:block;text-align:center;color:#555;font-size:18px}
.profile-preview-photo{display:block;width:180px;height:180px;max-width:100%;margin:8px auto;object-fit:cover;border:3px solid #fff;box-shadow:1px 1px 2px #000;background:#eee;aspect-ratio:1/1}
.profile-message{display:block;margin:7px 0 0}
.error{color:#8b0000}.success{color:#005b20}
.profile-side-note{font-size:19px;color:#333;line-height:1.2}
@media(max-width:760px){body{padding:0}.profile-layout{grid-template-columns:1fr}.profile-sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile-sidebar .orkut-box{margin:0}.profile-editor{grid-template-columns:1fr}.profile-editor .wide{grid-column:auto}.site-tab{min-width:0;flex:1 1 30%;padding:6px 5px}}
@media(max-width:460px){.site-header{align-items:center}.brand-logo{width:42px;height:42px;flex-basis:42px}.brand-title{font-size:28px}.brand-subtitle{font-size:16px}.profile-sidebar{grid-template-columns:1fr}.profile-field-row{grid-template-columns:1fr}.site-nav{gap:3px;padding:5px}.site-tab{font-size:20px;flex:1 1 42%}}

.dashboard-grid{display:grid;grid-template-columns:260px minmax(0,1.7fr) minmax(260px,1fr);grid-template-areas:"profile center social";gap:14px;align-items:start}
.profile-sidebar{grid-area:profile;display:grid;gap:12px;align-content:start;min-width:0}
.profile-banner-panel{grid-area:auto;margin:0;min-width:0}
.profile-banner-panel .profile-cover{height:170px;width:100%;background:linear-gradient(120deg,#008080,#000080);background-size:cover;background-position:center;border:2px inset var(--dark)}
.profile-panel{grid-area:auto}
.dashboard-main{grid-area:center;display:grid;gap:14px;align-content:start;min-width:0}
.summary-panel{margin:0}
.requests-stack{display:grid;gap:0;align-content:start;min-width:0}
.social-side-stack{grid-area:social;display:grid;gap:12px;align-content:start;min-width:0}
#friendsPanel{grid-area:auto}
#campaignsPanel{grid-area:auto}
.social-side-stack>.orkut-box{margin:0}
.summary-panel{margin:0}
#requestsPanel{grid-area:auto}

.dashboard-widget .orkut-box-content{min-height:145px}
.dashboard-widget h2{font-size:23px;color:var(--blue);margin:0 0 9px;line-height:1.1}
.widget-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:8px;border-top:1px solid #aaa}
.widget-actions button,.widget-actions a{font:18px 'VT323',monospace;color:var(--blue);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.social-placeholder{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.social-placeholder p{flex:1 1 100%;margin:4px 0}
.social-avatar-placeholder{width:52px;height:52px;display:grid;place-items:center;background:#e5e5e5;border:2px inset var(--dark);color:#555;font-size:28px}
.social-person{min-width:90px;max-width:130px;text-align:center;font-size:18px;overflow-wrap:anywhere}
.social-person .social-avatar-placeholder{margin:0 auto 4px}
.profile-menu-item{text-transform:none}
.summary-greeting{text-transform:none}
.dashboard-widget .orkut-box-title,.summary-panel .orkut-box-title,.profile-panel>.orkut-box-title{text-transform:none}
.profile-panel{min-width:0}
.profile-panel{padding:4px}
.profile-panel-content{background:#e5e5e5;border:2px inset var(--dark);margin-top:4px;padding:9px}
.profile-cover{height:88px;background:linear-gradient(120deg,#008080,#000080);background-size:cover;background-position:center;border:2px inset var(--dark)}
.profile-panel-identity{text-align:left;padding:0 3px 8px}
.profile-avatar{display:block;width:75%;max-width:210px;aspect-ratio:1/1;height:auto;margin:0 auto 9px;position:relative;object-fit:cover;background:#e6eaf0;border:3px solid #fff;box-shadow:1px 1px 2px #000}
.profile-name-section{display:grid;gap:3px;padding:8px 5px 5px;border-top:2px groove #fff;text-align:left}
.profile-name-section .profile-edit-link{justify-self:start}
.profile-display-name{font-size:27px;line-height:1.05;font-weight:bold;color:#000;overflow-wrap:anywhere}
.profile-handle{font-size:19px;color:#444;margin-top:3px}
.profile-edit-link{display:inline-block;margin-top:3px;padding:0;border:0;background:transparent;color:var(--blue);font:17px 'VT323',monospace;text-decoration:underline;cursor:pointer}
.profile-edit-link:hover{color:#0000cc;background:transparent}
.profile-extra{border-top:1px solid #aaa;padding:8px 3px 2px;text-align:left;font-size:19px;white-space:pre-wrap;overflow-wrap:anywhere}
.profile-menu{display:grid;gap:10px;margin-top:7px}.profile-menu-section{display:grid;gap:3px;padding-top:9px;border-top:2px groove #fff}.profile-menu-section:first-child{padding-top:0;border-top:0}
.profile-menu-item{display:block;width:100%;padding:5px 9px;text-align:left;background:#e5e5e5;border:1px solid #999;color:var(--blue);font:20px 'VT323',monospace;cursor:pointer}
.profile-menu-item:hover{background:#fff;color:#000080;text-decoration:underline}
.profile-menu-item.active{font-weight:normal;border-left:1px solid #999;background:#e5e5e5;color:var(--blue);text-decoration:none}
/* O espaçamento entre Resumo e Pedidos é controlado somente pelo gap do dashboard-grid. */
.summary-greeting{font-size:32px;color:var(--blue);margin:0 0 10px}
.summary-counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.summary-counters>div{background:#e7e7e7;border:1px solid #999;padding:7px;text-align:center;display:grid;gap:2px}
.summary-counters strong{font-size:19px;color:var(--blue)}
.summary-counters span{font-size:25px;font-weight:bold}
.summary-details{border-top:1px solid #aaa;padding-top:7px}
.summary-details p{margin:5px 0;line-height:1.2}
.unavailable-value{color:#555}
.dashboard-widgets{display:contents}
.dashboard-widget{min-width:0;margin:0}
.dashboard-widget .orkut-box-content{height:100%;min-height:160px}
.dashboard-widget h2{font-size:23px;color:var(--blue);margin:0 0 9px;line-height:1.1}
.count-label{font-size:18px;color:#555;font-weight:normal}
.empty-state{font-size:19px;color:#444;line-height:1.2;margin:8px 0}
.widget-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:8px;border-top:1px solid #aaa}
.widget-actions button,.widget-actions a{font:18px 'VT323',monospace;color:var(--blue);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.campaign-list{display:grid;gap:7px}
.campaign-item{padding:6px;background:#eee;border:1px solid #aaa;min-width:0}
.campaign-item a{font-weight:bold;overflow-wrap:anywhere}
.campaign-item small{display:block}
.dashboard-notice{display:none;margin-top:10px;padding:7px;background:#111;color:var(--cyan);border:2px inset var(--dark)}
.dashboard-notice.visible{display:block}
@media(max-width:1100px){.dashboard-grid{grid-template-columns:220px minmax(0,1.5fr) minmax(220px,1fr)}}
@media(max-width:760px){main{padding:0 10px 10px}.dashboard-grid{grid-template-columns:1fr;grid-template-areas:"profile" "center" "social"}.dashboard-main{display:grid}.profile-panel{max-width:none}.profile-banner-panel .profile-cover{height:100px}.profile-panel-content{display:grid;grid-template-columns:1fr}.profile-avatar{width:75%;max-width:230px}.requests-stack{display:grid}.summary-counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.clock-window{position:fixed;right:18px;bottom:18px;width:min(340px,calc(100vw - 24px));z-index:10003;margin:0;box-shadow:4px 4px 0 #000}
.clock-display{background:#080808;color:var(--cyan);border:3px inset var(--dark);padding:12px;text-align:center;font-size:54px;line-height:1.1;text-shadow:0 0 8px rgba(5,255,161,.55);font-variant-numeric:tabular-nums}
.clock-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.clock-controls label{grid-column:1/-1;margin:0}
.clock-controls input{grid-column:1/-1}
.clock-test-option{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:18px}
.clock-test-option input{width:auto}
.clock-hint{font-size:17px;color:#444;margin:8px 0 0}
.clock-close{float:right;padding:0 7px;margin:-2px 0 0 8px}
@media(max-width:460px){.clock-window{right:8px;bottom:8px}}

/* Layout dos cartões sociais */
#requestsPanel .orkut-box-content{min-height:0;height:auto}
#friendsPanel .orkut-box-content{min-height:0;height:auto}
#friendsPanel{align-self:start}
.friend-request-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;padding:8px;background:#eee;border:1px solid #aaa}
.friend-demo-photo{width:64px;height:64px;object-fit:cover;border:2px inset var(--dark);background:#ddd}
.friend-request-copy{min-width:0}
.friend-request-name{font-weight:bold;font-size:22px;overflow-wrap:anywhere}
.friend-request-question{margin:4px 0 7px;font-size:20px}
.friend-request-actions{display:flex;gap:8px}
.friend-request-actions button{min-width:44px;padding:2px 8px;font-size:17px;line-height:1}
.friend-list-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.friend-list-card{display:grid;grid-template-columns:58px minmax(0,1fr);gap:7px;align-items:center;min-width:0}
.friend-list-card .friend-demo-photo{width:58px;height:58px}
.friend-list-name{font-weight:bold;overflow-wrap:anywhere;line-height:1.05}
.friend-message-count{font-size:17px;color:#444;line-height:1.05;margin-top:3px}
@media(max-width:760px){.friend-list-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.friend-list-grid{grid-template-columns:1fr}}
.site-footer{margin:22px 0 28px;padding:9px 12px;background:var(--win);border:3px solid;border-color:var(--light) var(--black) var(--black) var(--light);box-shadow:inset -1px -1px var(--dark),inset 1px 1px var(--light);display:flex;align-items:center;justify-content:center;gap:7px 13px;flex-wrap:wrap;text-align:center;font-size:19px;line-height:1.2}
.site-footer .footer-brand{font-weight:bold;color:#111}
.site-footer a{color:var(--blue);white-space:nowrap}
.site-footer .footer-separator{color:#555}
@media(max-width:760px){.site-footer{margin:18px 0 20px;padding:9px 7px;gap:6px 9px;font-size:18px}}
